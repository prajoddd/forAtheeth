<style>

0%;max-height:45svh;object-fit:contain;object-position:center bottom;border:0;outline:0;mix-blend-mode:screen;filter:drop-shadow(0 12px 15px #0009);mask-image:radial-gradient(ellipse at 50% 45%,#000 44%,#000c 63%,transparent 82%);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 44%,#000c 63%,transparent 82%)}.portrait-wrap:after{content:"PRAJOD // PLAYER 01";display:block;text-align:center;color:var(--gold);font-size:10px;letter-spacing:2px;margin-top:15px}.intro-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,.8fr);gap:28px;align-items:center}.dialogue{background:#171326;border:2px solid #55456e;padding:20px;position:relative;min-height:156px;box-shadow:8px 8px 0 #08070e}.dialogue:before{content:"TRANSMISSION INCOMING";display:block;font-size:10px;letter-spacing:2px;color:var(--cyan);margin-bottom:12px}.dialogue p{font-family:system-ui,sans-serif;font-size:17px;line-height:1.55;margin:0}.tapcue{display:block;text-align:right;color:var(--gold);font-size:11px;margin-top:18px;animation:blink 1s steps(2) infinite}.cake-stage{text-align:center}.cake-area{position:relative;height:270px;max-width:500px;margin:18px auto 8px;touch-action:none;user-select:none;overflow:hidden;border-bottom:2px solid #564465;background:radial-gradient(ellipse at 50% 80%,#513356 0,transparent 68%),linear-gradient(#171326,#100d1c)}.cake{position:absolute;left:50%;top:48%;width:min(74%,330px);height:132px;transform:translate(-50%,-50%);transition:filter .2s}.cake-top{position:absolute;left:0;right:0;top:0;height:58px;border-radius:50%;background:#ffb7d1;border:4px solid #ffe4ef;box-shadow:inset 0 -8px #f178a3;z-index:3}.cake-side{position:absolute;left:4%;right:4%;top:29px;height:92px;background:repeating-linear-gradient(0deg,#a54a6e 0 18px,#ffd0d9 18px 29px);border:4px solid #ffb7d1;border-top:0;border-radius:0 0 18px 18px;box-shadow:0 12px 0 #592743}.sprinkle{position:absolute;width:10px;height:4px;border-radius:4px;background:var(--cyan);transform:rotate(28deg);z-index:4}.candle{position:absolute;z-index:5;top:-24px;left:48%;height:32px;width:9px;background:repeating-linear-gradient(0deg,#fff 0 6px,#ff5e8a 6px 12px);border-radius:2px}.flame{position:absolute;top:-15px;left:1px;width:8px;height:12px;background:var(--gold);border-radius:80% 10% 80% 10%;transform:rotate(35deg);box-shadow:0 0 15px var(--gold)}.slice-mark{position:absolute;z-index:8;left:50%;top:8%;height:105px;width:4px;background:#fff7d5;box-shadow:0 0 10px white;transform:rotate(var(--rot,20deg));animation:slash .4s ease-out forwards;pointer-events:none}.cake-piece{position:absolute;z-index:9;width:38px;height:26px;background:#ffb7d1;border:3px solid #ffe4ef;top:35%;left:50%;border-radius:50% 50% 10% 10%;animation:crumb .8s ease-out forwards}.progress-label{color:var(--gold);font-weight:bold;letter-spacing:2px}.progress-track{height:12px;border:2px solid #645177;padding:2px;margin:10px auto;width:min(100%,390px)}.progress-fill{height:100%;width:0;background:var(--pink);transition:width .25s}.hint{font-size:12px;color:var(--muted);line-height:1.6}.boss-reveal{text-align:center;overflow:hidden}.boss{font-size:100px;line-height:1;filter:drop-shadow(0 0 25px #a9ff5c77);animation:bossEnter .8s cubic-bezier(.2,1.8,.4,1) both}.reveal-impact{height:230px;position:relative;display:flex;align-items:center;justify-content:center;animation:bossEnter .7s cubic-bezier(.2,1.8,.4,1) both}.reveal-impact img{height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 15px 12px #0009)}.bossname{color:var(--pink);font-weight:1000;font-size:clamp(30px,8vw,60px);text-shadow:4px 4px #5b214b}.fight-shell{width:100%;max-width:820px;margin:0 auto}.fight-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;font-size:11px;letter-spacing:1px}.hpbox{flex:1}.hp-label{display:flex;justify-content:space-between;margin-bottom:5px;color:var(--muted)}.hp-track{height:13px;background:#35263f;border:2px solid #786188;padding:2px}.hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff416c,#ff9e5e);transition:width .15s}.playerhp{background:linear-gradient(90deg,#6cf5e8,#baff8d)}canvas{display:block;width:100%;aspect-ratio:3/4;max-height:52svh;background:#171326;border:2px solid #625078;touch-action:none;image-rendering:pixelated}.fight-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.move-pair,.action-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}.fight-controls button{min-width:0}.fight-controls button{min-height:60px;font-weight:900}.fight-controls .attack{background:var(--pink);border-color:#ffc5d5}.fight-controls .dodge{background:#254d61;border-color:var(--cyan)}.fight-controls .move{background:#302443;border-color:#9d82c2}.statusline{text-align:center;min-height:20px;font-size:11px;color:var(--gold);margin:8px 0}.overlay{position:absolute;inset:0;background:#0d0919ed;display:flex;align-items:center;justify-content:center;padding:22px;z-index:10}.modal{width:min(100%,440px);text-align:center;border:2px solid var(--gold);background:#1b1730;padding:26px;box-shadow:10px 10px 0 #07060b}.modal h2{font-size:28px;margin:0 0 10px;color:var(--gold)}.letter-scene{max-width:720px;margin:auto;width:100%}.letter-card{background:linear-gradient(135deg,#fff3dd,#f2d9bd);color:#34213b;padding:clamp(22px,5vw,44px);box-shadow:10px 10px 0 #5a315d;position:relative;transform:rotate(-.4deg)}.letter-card h2{font-family:Georgia,serif;font-size:clamp(26px,6vw,42px);margin:0 0 18px}.letter-card p{font-family:Georgia,serif;font-size:clamp(16px,3.8vw,19px);line-height:1.7;margin:0 0 15px}.signature{font-family:"Brush Script MT",cursive;font-size:32px;color:#8a3159;transform:rotate(-4deg);margin-top:22px}.letter-progress{display:flex;gap:6px;margin:0 0 18px}.letter-dot{height:4px;flex:1;background:#44344e}.letter-dot.active{background:var(--pink)}.credits{text-align:center}.stamp{display:inline-block;border:3px solid var(--cyan);color:var(--cyan);padding:8px 14px;transform:rotate(-5deg);font-weight:1000;letter-spacing:3px;margin-bottom:22px}.credits-list{max-width:420px;margin:20px auto;text-align:left;line-height:2;color:#d8cce8}.credits-list span{float:right;color:var(--gold)}.finale{font-size:clamp(25px,7vw,48px);font-weight:1000;color:var(--gold);text-shadow:3px 3px #673657}.shake{animation:shake .35s linear}.flash{animation:flash .18s}.footer{font-size:10px;color:#776b8b;text-align:center;padding:12px 0 16px;letter-spacing:1px}
.speech{border-radius:18px 18px 18px 4px;animation:bubblePop .3s ease both}.speech:after{content:"";position:absolute;left:-11px;bottom:22px;border-width:10px 12px 10px 0;border-style:solid;border-color:transparent #55456e transparent transparent}.reveal-btn{animation:sceneIn .4s ease both}@keyframes bubblePop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}@keyframes sceneIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes blink{50%{opacity:.25}}@keyframes slash{from{opacity:1;transform:translateY(-30px) rotate(var(--rot,20deg))}to{opacity:0;transform:translateY(100px) rotate(var(--rot,20deg))}}@keyframes crumb{to{transform:translate(90px,100px) rotate(150deg);opacity:0}}@keyframes bossEnter{0%{transform:translateY(-180px) scale(2);opacity:0}70%{transform:translateY(15px) scale(.9)}100%{transform:none;opacity:1}}@keyframes shake{25%{transform:translate(6px,-4px)}50%{transform:translate(-5px,3px)}75%{transform:translate(4px,2px)}}@keyframes flash{50%{filter:brightness(2.5)}}
@media(max-width:650px){.app{padding-left:12px;padding-right:12px}.intro-layout{grid-template-columns:1fr;gap:14px}.portrait-wrap{max-width:190px;margin-bottom:8px}.portrait{max-height:26svh}.portrait-wrap:after{margin-top:9px}.scene{padding-top:15px}.title{letter-spacing:-1px}.dialogue{min-height:145px;padding:16px}.cake-area{height:245px}.fight-controls button{padding:10px 5px;min-height:58px;font-size:12px}.fight-head{font-size:9px}.footer{padding-bottom:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
.move-pair,.action-pair{display:flex;gap:8px}.fight-controls{justify-content:space-between;align-items:center}.fight-controls button{min-height:52px;touch-action:none;user-select:none}@media(max-width:520px){.fight-controls button{padding:11px 8px;min-width:64px;font-size:12px}.move-pair,.action-pair{gap:5px}}\n</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar"><span class="brand">★ THEETAM ARCADE</span><button class="sound" id="soundBtn" aria-label="Toggle sound">♪ SOUND: ON</button></header>
<main class="scene" id="scene"></main>
<footer class="footer">A SMALL GAME MADE WITH AN UNREASONABLE AMOUNT OF LOVE · v1.0</footer>
</div>
<script>
(()=>{
const scene=document.getElementById('scene'), soundBtn=document.getElementById('soundBtn');
let soundOn=true,audio=null,audioUnlocked=false,sceneIndex=0,dialogueIndex=0,cutCount=0,letterIndex=0,game=null,raf=0,typing=false,typeTimer=0,sceneTimers=new Set();
const lines=[
"Hey Atheeth. It's Prajod. I'm late. I have no respectable defence.",
"I'm genuinely sorry I couldn't be there with you right now.",
"So I made this little chaos machine instead. Not as fun as having me there — obviously — but I hope it makes you smile.",
"Enough feelings. There's a cake. There's a mission. Trust me exactly once."
];
function beep(freq=440,dur=.07,type='square',vol=.025){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended'&&!audioUnlocked)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch(e){}}
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='♪ SOUND: '+(soundOn?'ON':'OFF');if(soundOn){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();audioUnlocked=true}catch(e){}beep(660,.1)}};
function unlockAudio(){if(!soundOn||audioUnlocked)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().then(()=>{audioUnlocked=true;beep(520,.04)}).catch(()=>{});}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{once:true});document.addEventListener('keydown',unlockAudio,{once:true});
function clearSceneWork(){if(typeTimer){clearTimeout(typeTimer);typeTimer=0}for(const id of sceneTimers)clearTimeout(id);sceneTimers.clear();cancelAnimationFrame(raf);raf=0;}
function sceneTimeout(fn,delay){const owner=sceneIndex;const id=setTimeout(()=>{sceneTimers.delete(id);if(owner===sceneIndex)fn()},delay);sceneTimers.add(id);return id}
function setScene(html){clearSceneWork();sceneIndex++;scene.innerHTML=html;scene.classList.remove('shake');void scene.offsetWidth;scene.classList.add('scene');}
function intro(){dialogueIndex=0;setScene(`<div class="intro-layout"><div><p class="eyebrow">A MESSAGE FOR ATHEETH</p><h1 class="title">HEY,<br><em>THEETAM.</em></h1><div class="dialogue speech" id="dialogue" role="button" tabindex="0" aria-label="Tap to continue dialogue"><p id="line"></p><span class="tapcue">TAP TO CONTINUE ▸</span></div><div class="btnrow"><button class="primary hidden" id="begin">BEGIN THE QUEST ↗</button></div></div><div class="portrait-wrap"><img class="portrait" src="assets/your-photo.jpg" alt="Your portrait for the birthday message"></div></div>`);renderLine();const d=document.getElementById('dialogue');d.onclick=nextLine;d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nextLine()}};document.getElementById('begin').onclick=()=>{if(dialogueIndex<lines.length-1){dialogueIndex=lines.length-1;renderLine()}else cakeScene()};}
function renderLine(){if(typeTimer){clearTimeout(typeTimer);typeTimer=0}const el=document.getElementById('line');if(!el)return;el.textContent='';const text=lines[dialogueIndex];const begin=document.getElementById('begin');if(begin)begin.classList.add('hidden');typing=true;let i=0;const owner=sceneIndex;const tick=()=>{typeTimer=0;if(owner!==sceneIndex||!el.isConnected)return;el.textContent=text.slice(0,i++);if(i<=text.length){if(i%3===0)beep(250,.015,'square',.008);typeTimer=setTimeout(tick,14)}else{typing=false;if(begin&&dialogueIndex===lines.length-1){begin.classList.remove('hidden');begin.classList.add('reveal-btn')}}};tick()}
function finishCurrentLine(){if(typeTimer){clearTimeout(typeTimer);typeTimer=0}const el=document.getElementById('line');if(el)el.textContent=lines[dialogueIndex];typing=false;const begin=document.getElementById('begin');if(begin&&dialogueIndex===lines.length-1){begin.classList.remove('hidden');begin.classList.add('reveal-btn')}}
function nextLine(){if(typing){finishCurrentLine();return}if(dialogueIndex<lines.length-1){dialogueIndex++;renderLine();beep(520)}else if(!document.getElementById('begin')||!document.getElementById('begin').classList.contains('hidden')){cakeScene()}}
function cakeScene(){cutCount=0;setScene(`<div class="cake-stage"><p class="eyebrow">DESSERT PROTOCOL</p><h1 class="title">SEVEN<br><em>SLICES.</em></h1><p class="hint">Swipe from bottom to top to cut the cake.</p><div class="cake-area" id="cakeArea" aria-label="Swipe across the cake to slice it"><div class="cake" id="cake"><div class="cake-top"></div><div class="cake-side"></div><div class="candle"><i class="flame"></i></div></div></div><div class="progress-label">SLICES: <span id="cutNum">0</span> / 7</div><div class="progress-track"><div class="progress-fill" id="cutFill"></div></div><p class="hint" id="cutHint">PRESS AND SWIPE THROUGH THE CAKE — TAPS DON'T COUNT.</p></div>`);
const area=document.getElementById('cakeArea');let start=null,activePointer=null,gestureUsed=false;
const point=e=>{const r=area.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
const clearGesture=()=>{start=null;activePointer=null;gestureUsed=false};
area.addEventListener('pointerdown',e=>{if(cutCount>=7||activePointer!==null)return;start=point(e);activePointer=e.pointerId;gestureUsed=false;try{area.setPointerCapture(e.pointerId)}catch(_){}});
area.addEventListener('pointerup',e=>{if(activePointer!==e.pointerId||!start)return;const a=start,end=point(e);const dx=end.x-a.x,dy=end.y-a.y,dist=Math.hypot(dx,dy);const cake=document.getElementById('cake').getBoundingClientRect(),r=area.getBoundingClientRect();const cr={left:cake.left-r.left-8,right:cake.right-r.left+8,top:cake.top-r.top-8,bottom:cake.bottom-r.top+8};const intersects=(a.x>=cr.left&&a.x<=cr.right&&a.y>=cr.top&&a.y<=cr.bottom)||(end.x>=cr.left&&end.x<=cr.right&&end.y>=cr.top&&end.y<=cr.bottom)||segmentIntersectsRect(a,end,cr);if(!gestureUsed&&dist>=65&&dy<=-45&&intersects&&cutCount<7){gestureUsed=true;doCut(a,end)}else if(cutCount<7){document.getElementById('cutHint').textContent='Swipe upward through the cake — make it a proper slice!';beep(150,.08)}clearGesture()});
area.addEventListener('pointercancel',clearGesture);area.addEventListener('lostpointercapture',clearGesture);
function segmentIntersectsRect(a,b,r){let t0=0,t1=1,dx=b.x-a.x,dy=b.y-a.y;for(const [p,q] of [[-dx,a.x-r.left],[dx,r.right-a.x],[-dy,a.y-r.top],[dy,r.bottom-a.y]]){if(p===0){if(q<0)return false}else{const t=q/p;if(p<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}}return t0<=t1}
function doCut(a,b){cutCount++;beep(330+cutCount*55,.1,'sawtooth');const mark=document.createElement('i');mark.className='slice-mark';mark.style.setProperty('--rot',`${Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI+90}deg`);mark.style.left=((a.x+b.x)/2/area.clientWidth*100)+'%';area.append(mark);const piece=document.createElement('i');piece.className='cake-piece';piece.style.left=(50+(Math.random()*18-9))+'%';piece.style.top=(25+Math.random()*35)+'%';area.append(piece);const cake=document.getElementById('cake');cake.style.transform=`translate(-50%,-50%) rotate(${cutCount%2?1.5:-1.5}deg) scale(${1-cutCount*.025})`;cake.style.filter=`saturate(${1+cutCount*.08})`;document.getElementById('cutNum').textContent=cutCount;document.getElementById('cutFill').style.width=(cutCount/7*100)+'%';document.getElementById('cutHint').textContent=['Nice cut. The cake is nervous.','Two slices. The frosting has filed a complaint.','Three. Culinary excellence.','Four. A suspicious smell approaches.','Five. Why did the candle just blink?','Six. Something is moving beneath the icing.','SEVEN. REWARD UNLOCKED.'][cutCount-1];if(cutCount===7)sceneTimeout(revealBoss,800)}
}
function revealBoss(){scene.classList.add('shake');beep(90,.4,'sawtooth',.06);sceneTimeout(()=>{setScene(`<div class="boss-reveal"><p class="eyebrow">WARNING // DESSERT INTEGRITY: 0%</p><div class="reveal-impact"><img src="assets/poop-boss.png" alt="The poop boss crashes the cake"></div><h1 class="bossname">THEETAM<br>THE CAKE RUINER</h1><p class="lead" style="margin:12px auto">“You thought this was a birthday cake? THINK AGAIN.”</p><p class="hint">A being made entirely of bad decisions has entered the arena.</p><div class="btnrow" style="justify-content:center"><button class="primary" id="fightStart">DEFEND YOUR DESSERT ▸</button></div></div>`);document.getElementById('fightStart').onclick=startFight},350)}
function startFight(){game={running:true,player:{x:.13,y:.76,hp:100,inv:0,attack:0,attackCooldown:0,attackHit:false,dash:0,hitFlash:0,facing:1},boss:{x:.72,y:.76,hp:200,max:200,dir:1,hop:0,attackTimer:.8,telegraph:0,flash:0,burstTimer:0,meleeTimer:2.8,meleeWindup:0,charge:0,recovery:0},projectiles:[],particles:[],keys:{},last:0,elapsed:0,won:false,lost:false};fightScene()}
function fightScene(){setScene(`<div class="fight-shell"><p class="eyebrow">BOSS FIGHT // PHASE 01: DESSERT DISASTER</p><div class="fight-head"><div class="hpbox"><div class="hp-label"><span>THEETAM</span><span id="bossPct">200 HP</span></div><div class="hp-track"><div class="hp-fill" id="bossHp"></div></div></div><div class="hpbox"><div class="hp-label"><span>ATHEETH</span><span id="playerPct">100 HP</span></div><div class="hp-track"><div class="hp-fill playerhp" id="playerHp"></div></div></div></div><canvas id="arena" width="600" height="800" aria-label="Real-time boss fight arena"></canvas><div class="statusline" id="statusline">Move to dodge. Attack when close. Watch the warning!</div><div class="fight-controls"><div class="move-pair"><button class="move" id="leftBtn" aria-label="Move left">◀ LEFT</button><button class="move" id="rightBtn" aria-label="Move right">RIGHT ▶</button></div><div class="action-pair"><button class="dodge" id="dodgeBtn">✦ DODGE</button><button class="attack" id="attackBtn">⚔ ATTACK</button></div></div><p class="hint" style="text-align:center;margin:9px 0 0">KEYBOARD: ← → / A D = MOVE · SPACE = ATTACK · SHIFT = DODGE</p></div><div class="overlay hidden" id="fightOverlay"><div class="modal" id="fightModal"></div></div>`);
const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d',{alpha:true});game.canvas=canvas;game.ctx=ctx;document.getElementById('bossPct').textContent='200 HP';document.getElementById('bossHp').style.width='100%';
const keydown=e=>{if(!game?.running)return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();game.keys[e.key.toLowerCase()]=true;if(e.key===' '&&!e.repeat)attack();if(e.key==='Shift'&&!e.repeat)dodge()};const keyup=e=>{if(game)game.keys[e.key.toLowerCase()]=false};const blur=()=>{if(game)game.keys={}};game.keydown=keydown;game.keyup=keyup;game.blur=blur;window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);window.addEventListener('blur',blur);
const bindHold=(id,key)=>{const el=document.getElementById(id);const release=()=>{if(game)game.keys[key]=false};el.addEventListener('pointerdown',e=>{e.preventDefault();game.keys[key]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>el.addEventListener(ev,release));};bindHold('leftBtn','arrowleft');bindHold('rightBtn','arrowright');
document.getElementById('dodgeBtn').onclick=dodge;document.getElementById('attackBtn').onclick=attack;
