<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100d1c"><title>THEETAM — The Birthday Boss Fight</title>
<style>
:root{--ink:#f8efd9;--muted:#b8afc8;--bg:#100d1c;--panel:#1b1730;--pink:#ff5e8a;--gold:#ffd166;--cyan:#6cf5e8;--red:#ff4d6d;--pixel:monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{overscroll-behavior:none}body{user-select:none;-webkit-user-select:none}input,textarea{user-select:text;-webkit-user-select:text}
.speech{border-radius:18px 18px 18px 4px;animation:bubblePop .3s ease both}.speech:after{content:"";position:absolute;left:-11px;bottom:22px;border-width:10px 12px 10px 0;border-style:solid}
@media(max-width:650px){.app{padding-left:12px;padding-right:12px}.intro-layout{grid-template-columns:1fr;gap:14px}.portrait-wrap{max-width:190px;margin-bottom:8px}.portrait{max-height:26svh}
.move-pair,.action-pair{display:flex;gap:8px}.fight-controls{justify-content:space-between;align-items:center}.fight-controls button{min-height:52px;touch-action:none;user-select:none}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar"><span class="brand">★ THEETAM ARCADE</span><button class="sound" id="soundBtn" aria-label="Toggle sound">♪ SOUND: ON</button></header>
<main class="scene" id="scene"></main>
<footer class="footer">A SMALL GAME MADE WITH AN UNREASONABLE AMOUNT OF LOVE · v1.0</footer>
</div>
<script>
(()=>{
const scene=document.getElementById('scene'), soundBtn=document.getElementById('soundBtn');
let soundOn=true,audio=null,audioUnlocked=false,sceneIndex=0,dialogueIndex=0,cutCount=0,letterIndex=0,game=null,raf=0,typing=false,typeTimer=0,sceneTimers=new Set();
const lines=[
"Hey Atheeth! It's Prajod. I'm late. I have no respectable defence.",
"I'm genuinely sorry I couldn't be there with you right now.",
"So I made this little chaos machine instead. Not as fun as having me there — obviously — but I hope it makes you smile.",
"Enough feelings. There's a cake. There's a mission. Trust me exactly once."
];
function beep(freq=440,dur=.07,type='square',vol=.025){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended'&&!audioUnlocked)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type=type;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent='♪ SOUND: '+(soundOn?'ON':'OFF');if(soundOn){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();audioUnlocked=true}catch(e){}}}
function unlockAudio(){if(!soundOn||audioUnlocked)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().then(()=>{audioUnlocked=true;beep(520,.04)}).catch(()=>{})}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{once:true});document.addEventListener('keydown',unlockAudio,{once:true});
function clearSceneWork(){if(typeTimer){clearTimeout(typeTimer);typeTimer=0}for(const id of sceneTimers)clearTimeout(id);sceneTimers.clear();cancelAnimationFrame(raf);raf=0}
function sceneTimeout(fn,delay){const owner=sceneIndex;const id=setTimeout(()=>{sceneTimers.delete(id);if(owner===sceneIndex)fn()},delay);sceneTimers.add(id);return id}
function setScene(html){clearSceneWork();sceneIndex++;scene.innerHTML=html;scene.classList.remove('shake');void scene.offsetWidth;scene.classList.add('scene');}
function intro(){dialogueIndex=0;setScene(`<div class="intro-layout"><div><p class="eyebrow">A MESSAGE FOR ATHEETH</p><h1 class="title">HEY,<br><em>THEETAM.</em></h1><div class="dialogue speech" id="dialogue"><div id="line"></div><div class="controls"><button id="nextLine">NEXT</button></div></div></div><aside class="portrait-wrap"><img class="portrait" src="assets/atheeth-warrior.png" alt="Atheeth"></aside></div>`);renderLine();document.getElementById('nextLine').onclick=nextLine}
function renderLine(){if(typeTimer){clearTimeout(typeTimer);typeTimer=0}const el=document.getElementById('line');if(!el)return;el.textContent='';const text=lines[dialogueIndex];let i=0;typing=true;function step(){if(i>text.length){typing=false;return}el.textContent=text.slice(0,i);i++;typeTimer=setTimeout(step,30)};step();}
function finishCurrentLine(){if(typeTimer){clearTimeout(typeTimer);typeTimer=0}const el=document.getElementById('line');if(el)el.textContent=lines[dialogueIndex];typing=false}
function nextLine(){if(typing){finishCurrentLine();return}if(dialogueIndex<lines.length-1){dialogueIndex++;renderLine();beep(520)}else introToCake();}
function cakeScene(){cutCount=0;setScene(`<div class="cake-stage"><p class="eyebrow">DESSERT PROTOCOL</p><h1 class="title">SEVEN<br><em>SLICES.</em></h1><p class="hint">Swipe from bottom to top to cut the cake.</p><div id="cakeArea" class="cake-area"></div><div class="controls"><button id="skipCake">SKIP</button></div></div>`);
const area=document.getElementById('cakeArea');let start=null,activePointer=null,gestureUsed=false;
const point=e=>{const r=area.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
const clearGesture=()=>{start=null;activePointer=null;gestureUsed=false};
area.addEventListener('pointerdown',e=>{if(cutCount>=7||activePointer!==null)return;start=point(e);activePointer=e.pointerId;gestureUsed=false;try{area.setPointerCapture(e.pointerId)}catch(_){} });
area.addEventListener('pointerup',e=>{if(activePointer!==e.pointerId||!start)return;const a=start,end=point(e);const dx=end.x-a.x,dy=end.y-a.y,dist=Math.hypot(dx,dy);if(dist<30){clearGesture();return}doCut(a,end);clearGesture();if(cutCount>=7)revealBoss()});
area.addEventListener('pointercancel',clearGesture);area.addEventListener('lostpointercapture',clearGesture);
function segmentIntersectsRect(a,b,r){let t0=0,t1=1,dx=b.x-a.x,dy=b.y-a.y;for(const [p,q] of [[-dx,a.x-r.left],[dx,r.right-a.x],[-dy,a.y-r.top],[dy,r.bottom-a.y]]){if(p===0){if(q<0)return false}else{const t=q/p;if(p<0){t0=Math.max(t0,t)}else{t1=Math.min(t1,t)}if(t0>t1)return false}}return true}
function doCut(a,b){cutCount++;beep(330+cutCount*55,.1,'sawtooth');const mark=document.createElement('i');mark.className='slice-mark';mark.style.setProperty('--rot',`${Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}deg`);document.body.appendChild(mark);sceneTimeout(()=>mark.remove(),1200)}
function revealBoss(){scene.classList.add('shake');beep(90,.4,'sawtooth',.06);sceneTimeout(()=>{setScene(`<div class="boss-reveal"><p class="eyebrow">WARNING // DESSERT INTEGRITY: 0%</p><div class="reveal-wrap"><img src="assets/atheeth-warrior.png" alt="Atheeth" /></div><div class="controls"><button id="begin">BEGIN</button></div></div>`);document.getElementById('begin').onclick=startFight},400)}
function startFight(){game={running:true,player:{x:.13,y:.76,hp:100,inv:0,attack:0,attackCooldown:0,attackHit:false,dash:0,hitFlash:0,facing:1},boss:{x:.72,y:.76,hp:200,max:200,dir:1,hop:0,attackTimer:2,telegraph:0,meleeTimer:1.6,meleeWindup:0,charge:0,recovery:0,flash:0},keys:{},projectiles:[],particles:[],elapsed:0,battleBg:null,photo:null,bossPhoto:null,canvas:null,ctx:null,keydown:null,keyup:null};fightScene();}
function fightScene(){setScene(`<div class="fight-shell"><p class="eyebrow">BOSS FIGHT // PHASE 01: DESSERT DISASTER</p><div class="fight-head"><div class="hpbox"><div class="hp-label"><span>THEETAM</span></div><div id="bossHp" class="boss-hp"><div id="bossPct" class="boss-pct">200 HP</div></div></div><div class="player-box"><div id="playerHp" class="player-hp"></div></div></div><canvas id="arena" width="600" height="800"></canvas><div class="fight-controls"><div class="move-pair"><button id="leftBtn">◀</button><button id="rightBtn">▶</button></div><div class="action-pair"><button id="dodgeBtn">DODGE</button><button id="attackBtn">ATTACK</button></div></div><div id="statusline" class="statusline"></div></div>`);
const canvas=document.getElementById('arena'),ctx=canvas.getContext('2d',{alpha:true});game.canvas=canvas;game.ctx=ctx;document.getElementById('bossPct').textContent='200 HP';document.getElementById('playerHp').style.width='100%';
const keydown=e=>{if(!game?.running)return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();game.keys[e.key.toLowerCase()]=true;if(e.key===' '&&!e.repeat)attack();};
const keyup=e=>{if(!game?.running)return;game.keys[e.key.toLowerCase()]=false};
game.keydown=keydown;game.keyup=keyup;window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);
const bindHold=(id,key)=>{const el=document.getElementById(id);const release=()=>{if(game)game.keys[key]=false};el.addEventListener('pointerdown',e=>{e.preventDefault();game.keys[key]=true;try{el.setPointerCapture(e.pointerId)}catch(_){} },{passive:false});el.addEventListener('pointerup',e=>{release();try{el.releasePointerCapture(e.pointerId)}catch(_){} });el.addEventListener('pointercancel',release)};
bindHold('leftBtn','arrowleft');bindHold('rightBtn','arrowright');document.getElementById('dodgeBtn').onclick=dodge;document.getElementById('attackBtn').onclick=attack;
function attack(){if(!game?.running)return;const p=game.player,b=game.boss;if(p.attack>0||p.attackCooldown>0)return;p.attack=.30;p.attackCooldown=.34;p.attackHit=false;beep(680,.06,'square');const dx=(game.keys.arrowright||game.keys.d?1:0)-(game.keys.arrowleft||game.keys.a?1:0);p.x=Math.max(.07,Math.min(.70,p.x+dx*.06));}
function dodge(){if(!game?.running||game.player.dash>0)return;const p=game.player;const dx=(game.keys.arrowright||game.keys.d?1:0)-(game.keys.arrowleft||game.keys.a?1:0);const direction=dx||p.facing||1;p.dash=.36;p.facing=direction;beep(860,.05,'sawtooth')}
function endFight(win){if(!game||!game.running)return;game.running=false;game.won=win;window.removeEventListener('keydown',game.keydown);window.removeEventListener('keyup',game.keyup);clearSceneWork();if(win)credits();else intro();}
function update(dt){if(!game?.running)return;const g=game,p=g.player,b=g.boss,cw=g.canvas?.width||600,ch=g.canvas?.height||800;g.elapsed+=dt;p.inv=Math.max(0,p.inv-dt);p.attack=Math.max(0,p.attack-dt);p.attackCooldown=Math.max(0,p.attackCooldown-dt);p.dash=Math.max(0,p.dash-dt);p.hitFlash=Math.max(0,p.hitFlash-dt);let dx=(g.keys.arrowright||g.keys.d?1:0)-(g.keys.arrowleft||game.keys?.a?1:0);if(dx)p.facing=Math.sign(dx);p.x=Math.max(.07,Math.min(.70,p.x+dx*dt*.62));p.y=.76;
b.hop+=dt*4;b.x=Math.max(.52,Math.min(.78,b.x+Math.sin(g.elapsed*1.25)*dt*.025));b.y=.76;b.attackTimer-=dt;
if(b.attackTimer<=0&&!b.telegraph&&!b.meleeWindup&&!b.charge&&b.meleeTimer>0){b.telegraph=.58;b.attackTimer=Math.max(.62,1.12-(1-b.hp/b.max)*.34);document.getElementById('statusline').textContent='⚠ PREPARING ATTACK'}
if(b.telegraph>0){b.telegraph-=dt;if(b.telegraph<=0&&g.running){const pressure=1+(1-b.hp/b.max)*.7;const count=(Math.random()<.36+(1-b.hp/b.max)*.35)?3:1;for(let i=0;i<count;i++){const q={x:b.x,y:.65+Math.random()*.06,vx:-(.18+.04*Math.random()),vy:-(.05+.02*Math.random()),life:2,spin:0,trail:[]};g.projectiles.push(q)}beep(300,.08,'sawtooth')}}
b.meleeTimer-=dt;if(b.meleeTimer<=0&&!b.meleeWindup&&!b.charge&&!b.telegraph){b.meleeTimer=Math.max(1.35,2.65-(1-b.hp/b.max)*.65);b.meleeWindup=.48;document.getElementById('statusline').textContent='⚠ SLAM WIND-UP'}
if(b.meleeWindup>0){b.meleeWindup-=dt}
for(const q of g.projectiles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;q.spin=(q.spin||0)+dt*7;q.trail.push({x:q.x,y:q.y});if(q.trail.length>5)q.trail.shift();if(q.active!==false&&Math.hypot((q.x-p.x)*cw,(q.y-p.y)*ch)<40){q.hit=true;p.hp=Math.max(0,p.hp-10);p.hitFlash=.18;beep(120,.08,'sawtooth');}}
g.projectiles=g.projectiles.filter(q=>q.active!==false&&!q.hit&&q.life>0);
g.particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt});g.particles=g.particles.filter(q=>q.life>0);
if(b.hp<=0)endFight(true);
}
function draw(){const g=game,c=g.ctx,w=c.canvas.width,h=c.canvas.height,p=g.player,b=g.boss;c.clearRect(0,0,w,h);
const bg=g.battleBg;if(bg&&bg.complete&&bg.naturalWidth){const scale=Math.max(w/bg.naturalWidth,h/bg.naturalHeight),bw=bg.naturalWidth*scale,bh=bg.naturalHeight*scale;c.drawImage(bg,(w-bw)/2,(h-bh)/2,bw,bh)}
c.fillStyle='#100c17';c.globalAlpha=.58;c.fillRect(0,h*.78,w,h*.22);c.globalAlpha=1;c.strokeStyle='#b6a49a';c.lineWidth=3;c.beginPath();c.moveTo(0,h*.78);c.lineTo(w,h*.78);c.stroke();const floor=h*.78
for(let i=0;i<18;i++){c.fillStyle=i%2?'#f2a35d':'#ff5e8a';c.globalAlpha=.2;c.fillRect((i*73+g.elapsed*8)%w,floor-((i*17)%35),3,3)}c.globalAlpha=1;
const px=p.x*w,bx=b.x*w;
if(b.telegraph>0){c.save();c.fillStyle='#ff5e8a24';c.fillRect(bx-72,floor-170,144,170);c.strokeStyle='#ff5e8a';c.lineWidth=4;c.setLineDash([9,7]);c.strokeRect(bx-72,floor-170,144,170);c.setLineDash([]);c.restore();}
const bi=g.bossPhoto, baseH=Math.min(h*.22,170), bh=baseH*(.62+.38*(b.hp/b.max)), bw=bi&&bi.naturalWidth?bh*bi.naturalWidth/bi.naturalHeight:150;
c.fillStyle='#0008';c.beginPath();c.ellipse(bx,floor-3,bw*.28,12,0,0,Math.PI*2);c.fill();
if(bi&&bi.complete&&bi.naturalWidth){c.save();c.globalAlpha=b.flash>0?.45:1;c.drawImage(bi,bx-bw*.5,floor-bh,bw,bh);c.restore()}else{c.font='100px sans-serif';c.fillText('💩',bx-50,floor)}
const pi=g.photo, ph=Math.min(h*.22,170), pw=ph*(pi&&pi.naturalWidth?pi.naturalWidth/pi.naturalHeight:.75), pxLeft=px-pw*.5;
c.fillStyle='#0009';c.beginPath();c.ellipse(px,floor-3,pw*.3,11,0,0,Math.PI*2);c.fill();
if(pi&&pi.complete&&pi.naturalWidth){c.save();if(p.inv>0&&Math.floor(p.inv*18)%2===0)c.globalAlpha=.4;if(p.hitFlash>0){c.shadowColor='#ff5e8a';c.shadowBlur=18}c.drawImage(pi,px-pw/2,floor-ph,pw,ph);c.restore()}else{c.fillStyle='#fff';c.font='bold 50px sans-serif';c.fillText('AT',px-20,floor-40)}
if(p.attack>0){c.save();c.strokeStyle='#fff0a6';c.lineWidth=10;c.beginPath();c.arc(px+30,floor-72,45,-.8,.8);c.stroke();c.fillStyle='#fff2b3';c.font='bold 19px monospace';c.textAlign='center';c.fillText('ATTACK',px+30,floor-72);c.restore()}
if(p.dash>0){c.strokeStyle='#6cf5e8';c.lineWidth=6;c.globalAlpha=.6;c.beginPath();c.moveTo(px-50,floor-50);c.lineTo(px-110,floor-50);c.stroke();c.globalAlpha=1}
for(const q of g.projectiles){q.trail.forEach((t,i)=>{c.globalAlpha=.10+i*.045;c.fillStyle='#ffd166';c.beginPath();c.arc(t.x*w,t.y*h,5+i*1.2,0,Math.PI*2);c.fill()});c.globalAlpha=1;c.save();c.translate(q.x*w,q.y*h);c.rotate(q.spin||0);c.fillStyle='#ffd166';c.beginPath();c.arc(0,0,9,0,Math.PI*2);c.fill();c.restore()}
c.fillStyle='#f8efd9';c.font='bold 14px monospace';c.textAlign='center';c.fillText('ATHEETH',px,Math.max(18,floor-ph-10));c.fillText('THEETAM',bx,Math.max(18,floor-bh-10));
if(b.telegraph>0){c.fillStyle='#ffb4ca';c.font='bold 20px monospace';c.textAlign='center';c.fillText('INCOMING!',w/2,h-24)}
}
function removeEdgeBlack(img){try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height);const data=d.data;for(let i=0;i<data.length;i+=4){if(data[i]===0&&data[i+1]===0&&data[i+2]===0&&data[i+3]===255){data[i+3]=0}}x.putImageData(d,0,0);const out=new Image();out.src=c.toDataURL();return out}catch(e){return null}}

// Explicitly load both images from the correct asset path so they are available to the canvas draw calls.
const bossPhoto = new Image();
bossPhoto.onload = ()=>{ if(game) game.bossPhoto = removeEdgeBlack(bossPhoto) || bossPhoto };
bossPhoto.onerror = ()=>{ /* ignore load errors here */ };
bossPhoto.src = 'assets/atheeth-warrior.png';

const photo = new Image();
photo.onload = ()=>{ if(game) game.photo = removeEdgeBlack(photo) || photo };
photo.onerror = ()=>{ /* ignore load errors here */ };
photo.src = 'assets/atheeth-warrior.png';

let prev=performance.now();function loop(now){if(!game?.running)return;const dt=Math.min(.04,(now-prev)/1000);prev=now;update(dt);draw();if(game?.running)raf=requestAnimationFrame(loop)}

function letterScene(){letterIndex=0;setScene(`<div class="letter-scene"><p class="eyebrow">BONUS UNLOCKED // FRIENDSHIP DLC</p><div class="letter-progress" id="letterProgress"></div><article class="letter" id="letterCard"></article><div class="controls"><button id="prevLetter">PREV</button><button id="nextLetter">NEXT</button></div></div>`);renderLetter();document.getElementById('prevLetter').onclick=()=>{letterIndex=Math.max(0,letterIndex-1);renderLetter()};document.getElementById('nextLetter').onclick=()=>{letterIndex=Math.min(letterPages.length-1,letterIndex+1);renderLetter()}} 

const letterPages=[
{title:"Hey, Atheeth.",body:["First of all: congratulations on defeating Theetam. A heroic battle against the worst thing to ever happen to a cake.","Jokes aside, I wanted to make something for you because I miss you." ]},
{title:"For the road ahead.",body:["I hope you build a future that makes you proud. Keep learning, keep trying, and don't let a bad day convince you that you're not capable of great things. You don't have to do it alone."]},
{title:"One thing to remember.",body:["You spend a lot of energy being there for people. Don't forget to save some of that care for yourself, too. You deserve patience, kindness, and room to figure things out."]}
];
function renderLetter(){const p=letterPages[letterIndex],card=document.getElementById('letterCard');document.getElementById('letterProgress').innerHTML=letterPages.map((_,i)=>`<i class="letter-dot ${i===letterIndex?'active':''}"></i>`).join('');card.innerHTML=`<h2>${p.title}</h2><div>${p.body.map(b=>`<p>${b}</p>`).join('')}</div>`}
function credits(){setScene(`<div class="credits"><p class="eyebrow">GAME CLEAR // SAVE FILE UPDATED</p><div class="stamp">MISSION COMPLETE</div><h1 class="title">CAKE:<br><em>DESTROYED.</em></h1><div class="controls"><button id="backHome">HOME</button></div></div>`);document.getElementById('backHome').onclick=intro}
intro();
})();
</script>
</body></html>
